<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; }
    a { color: #7fb4f2; } a:hover { color: #a8cdf7; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -.03em; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

    .blades { transform-origin: 50% 50%; animation: spin 1.9s linear infinite; }
    .blades-slow { transform-origin: 50% 50%; animation: spin 3.4s linear infinite; }
    .rise { animation: rise .7s cubic-bezier(.22,.8,.3,1) both; }
    .d1 { animation-delay: .04s; } .d2 { animation-delay: .10s; }
    .d3 { animation-delay: .16s; } .d4 { animation-delay: .22s; }
    .trace { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 2.2s cubic-bezier(.4,0,.2,1) .25s both; }
    .live { animation: breathe 2.6s ease-in-out infinite; }
  </style>
</helmet>

<div style="width: 1120px; height: 720px; position: relative; overflow: hidden; background: #07090f;">

  <div style="position: absolute; inset: 0; background:
       radial-gradient(900px 620px at 22% -6%, #1f3a6b 0%, rgba(31,58,107,0) 58%),
       radial-gradient(760px 640px at 92% 34%, #3d2a5c 0%, rgba(61,42,92,0) 56%),
       linear-gradient(160deg, #0a0f1a 0%, #070910 60%, #0c0812 100%);"></div>

  <div style="position: absolute; left: 56px; top: 40px; width: 1008px; height: 640px;
              border-radius: 20px; overflow: hidden; display: flex; flex-direction: column;
              background: rgba(14,17,26,.46); backdrop-filter: blur(40px) saturate(180%);
              -webkit-backdrop-filter: blur(40px) saturate(180%);
              border: .5px solid rgba(255,255,255,.16);
              box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.14) inset;">

    <div style="display: flex; align-items: center; gap: 20px; padding: 14px 20px 0 20px;">
      <div style="display: flex; gap: 8px;">
        <div style="width: 11px; height: 11px; border-radius: 50%; background: #ff5f57;"></div>
        <div style="width: 11px; height: 11px; border-radius: 50%; background: #febc2e;"></div>
        <div style="width: 11px; height: 11px; border-radius: 50%; background: #28c840;"></div>
      </div>

      <div style="flex-grow: 1; display: flex; justify-content: center;">
        <div style="display: flex; padding: 3px; gap: 2px; border-radius: 11px;
                    background: rgba(255,255,255,.06); border: .5px solid rgba(255,255,255,.1);">
          <div style="padding: 6px 16px; border-radius: 8px; color: #fff; font-size: 12.5px; font-weight: 590;
                      background: rgba(255,255,255,.16); box-shadow: 0 .5px 0 rgba(255,255,255,.2) inset,
                      0 2px 8px rgba(0,0,0,.25);">Обзор</div>
          <div style="padding: 6px 16px; border-radius: 8px; color: rgba(255,255,255,.55); font-size: 12.5px;">Вентиляторы</div>
          <div style="padding: 6px 16px; border-radius: 8px; color: rgba(255,255,255,.55); font-size: 12.5px;">Датчики</div>
          <div style="padding: 6px 16px; border-radius: 8px; color: rgba(255,255,255,.55); font-size: 12.5px;">Настройки</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 7px; width: 92px; justify-content: flex-end;">
        <div class="live" style="width: 6px; height: 6px; border-radius: 50%; background: #34c98a;
                    box-shadow: 0 0 10px rgba(52,201,138,.9);"></div>
        <span style="color: rgba(255,255,255,.45); font-size: 11px;">на связи</span>
      </div>
    </div>

    <div class="rise d1" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 18px; padding: 26px 28px 0 28px;">

      <div style="display: flex; align-items: center; gap: 22px;">
        <div style="position: relative; width: 132px; height: 132px; flex: none;">
          <svg width="132" height="132" viewBox="0 0 132 132" style="position: absolute; inset: 0;">
            <defs>
              <linearGradient id="arc1" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#3987e5"/><stop offset="1" stop-color="#6fd0d8"/>
              </linearGradient>
            </defs>
            <circle cx="66" cy="66" r="58" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"
                    stroke-dasharray="273 91" transform="rotate(125 66 66)"/>
            <circle cx="66" cy="66" r="58" fill="none" stroke="url(#arc1)" stroke-width="3" stroke-linecap="round"
                    stroke-dasharray="132 232" transform="rotate(125 66 66)"/>
          </svg>
          <svg width="132" height="132" viewBox="0 0 132 132" style="position: absolute; inset: 0;">
            <g class="blades" opacity=".16">
              <path d="M66 66 C66 40 56 26 66 20 C76 26 66 40 66 66Z" fill="#cfe6ff"/>
              <path d="M66 66 C92 66 106 56 112 66 C106 76 92 66 66 66Z" fill="#cfe6ff"/>
              <path d="M66 66 C66 92 76 106 66 112 C56 106 66 92 66 66Z" fill="#cfe6ff"/>
              <path d="M66 66 C40 66 26 76 20 66 C26 56 40 66 66 66Z" fill="#cfe6ff"/>
            </g>
          </svg>
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column;
                      align-items: center; justify-content: center; gap: 0;">
            <span class="num" style="color: #fff; font-size: 40px; font-weight: 600;">2600</span>
            <span style="color: rgba(255,255,255,.4); font-size: 10.5px; margin-top: -2px;">об/мин</span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 9px;">
          <span style="color: rgba(255,255,255,.92); font-size: 15px; font-weight: 560;">Вентилятор 1</span>
          <div style="display: flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px;
                      background: rgba(57,135,229,.16); border: .5px solid rgba(57,135,229,.32); width: fit-content;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8dc0f5" stroke-width="2.4" stroke-linecap="round"><path d="M3 18l5-7 4 3 4-8 5 5"/></svg>
            <span style="color: #a9cdf5; font-size: 11.5px; font-weight: 560;">По кривой</span>
          </div>
          <span style="color: rgba(255,255,255,.34); font-size: 11px;">ведёт CPU · 78°</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 22px;">
        <div style="position: relative; width: 132px; height: 132px; flex: none;">
          <svg width="132" height="132" viewBox="0 0 132 132" style="position: absolute; inset: 0;">
            <circle cx="66" cy="66" r="58" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"
                    stroke-dasharray="273 91" transform="rotate(125 66 66)"/>
            <circle cx="66" cy="66" r="58" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="3" stroke-linecap="round"
                    stroke-dasharray="58 306" transform="rotate(125 66 66)"/>
          </svg>
          <svg width="132" height="132" viewBox="0 0 132 132" style="position: absolute; inset: 0;">
            <g class="blades-slow" opacity=".12">
              <path d="M66 66 C66 40 56 26 66 20 C76 26 66 40 66 66Z" fill="#e6eef8"/>
              <path d="M66 66 C92 66 106 56 112 66 C106 76 92 66 66 66Z" fill="#e6eef8"/>
              <path d="M66 66 C66 92 76 106 66 112 C56 106 66 92 66 66Z" fill="#e6eef8"/>
              <path d="M66 66 C40 66 26 76 20 66 C26 56 40 66 66 66Z" fill="#e6eef8"/>
            </g>
          </svg>
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column;
                      align-items: center; justify-content: center;">
            <span class="num" style="color: #fff; font-size: 40px; font-weight: 600;">1654</span>
            <span style="color: rgba(255,255,255,.4); font-size: 10.5px; margin-top: -2px;">об/мин</span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 9px;">
          <span style="color: rgba(255,255,255,.92); font-size: 15px; font-weight: 560;">Вентилятор 2</span>
          <div style="display: flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px;
                      background: rgba(255,255,255,.07); border: .5px solid rgba(255,255,255,.14); width: fit-content;">
            <span style="color: rgba(255,255,255,.66); font-size: 11.5px; font-weight: 560;">Система</span>
          </div>
          <span style="color: rgba(255,255,255,.34); font-size: 11px;">автоматически</span>
        </div>
      </div>
    </div>

    <div class="rise d2" style="display: flex; gap: 30px; padding: 26px 30px 0 30px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span class="num" style="color: #ff8a5c; font-size: 25px; font-weight: 580;">78°</span>
        <span style="color: rgba(255,255,255,.42); font-size: 11px;">Процессор</span>
      </div>
      <div style="width: .5px; background: rgba(255,255,255,.1);"></div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span class="num" style="color: rgba(255,255,255,.92); font-size: 25px; font-weight: 580;">34°</span>
        <span style="color: rgba(255,255,255,.42); font-size: 11px;">Графика</span>
      </div>
      <div style="width: .5px; background: rgba(255,255,255,.1);"></div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span class="num" style="color: rgba(255,255,255,.92); font-size: 25px; font-weight: 580;">37°</span>
        <span style="color: rgba(255,255,255,.42); font-size: 11px;">Корпус</span>
      </div>
      <div style="width: .5px; background: rgba(255,255,255,.1);"></div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span class="num" style="color: rgba(255,255,255,.92); font-size: 25px; font-weight: 580;">34°</span>
        <span style="color: rgba(255,255,255,.42); font-size: 11px;">Накопитель</span>
      </div>
      <div style="width: .5px; background: rgba(255,255,255,.1);"></div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span class="num" style="color: rgba(255,255,255,.92); font-size: 25px; font-weight: 580;">31°</span>
        <span style="color: rgba(255,255,255,.42); font-size: 11px;">Батарея</span>
      </div>
      <div style="flex-grow: 1;"></div>
      <div style="display: flex; align-self: flex-start; padding: 3px; gap: 2px; border-radius: 9px;
                  background: rgba(255,255,255,.05); border: .5px solid rgba(255,255,255,.09);">
        <div style="padding: 4px 11px; border-radius: 7px; color: rgba(255,255,255,.5); font-size: 11px;">5м</div>
        <div style="padding: 4px 11px; border-radius: 7px; color: #fff; font-size: 11px; font-weight: 560;
                    background: rgba(255,255,255,.14);">15м</div>
        <div style="padding: 4px 11px; border-radius: 7px; color: rgba(255,255,255,.5); font-size: 11px;">30м</div>
      </div>
    </div>

    <div class="rise d3" style="flex-grow: 1; display: flex; flex-direction: column;
                padding: 18px 30px 22px 30px; gap: 12px; min-height: 0;">
      <svg viewBox="0 0 1000 210" style="width: 100%; flex-grow: 1;" preserveAspectRatio="none">
        <defs>
          <linearGradient id="fill1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff8a5c" stop-opacity=".26"/>
            <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line x1="0" y1="26" x2="1000" y2="26" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
        <line x1="0" y1="88" x2="1000" y2="88" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
        <line x1="0" y1="150" x2="1000" y2="150" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
        <line x1="0" y1="200" x2="1000" y2="200" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

        <path d="M0 74 C70 62 116 88 176 72 C240 55 280 84 344 66 C406 49 446 78 512 60 C574 44 616 72 682 56 C744 41 790 66 856 52 C910 41 950 56 1000 46 L1000 210 L0 210 Z"
              fill="url(#fill1)"/>
        <path class="trace" d="M0 74 C70 62 116 88 176 72 C240 55 280 84 344 66 C406 49 446 78 512 60 C574 44 616 72 682 56 C744 41 790 66 856 52 C910 41 950 56 1000 46"
              fill="none" stroke="#ff8a5c" stroke-width="2" stroke-linecap="round"/>
        <path class="trace" d="M0 120 C66 112 110 130 172 118 C236 106 276 128 340 116 C404 104 444 124 510 112 C572 101 614 120 680 108 C742 97 788 114 854 104 C908 96 950 106 1000 100"
              fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round"/>
        <path class="trace" d="M0 170 C80 168 130 174 210 170 C290 166 340 172 420 169 C500 166 550 171 630 168 C710 165 760 170 840 167 C900 165 950 168 1000 166"
              fill="none" stroke="#199e70" stroke-width="2" stroke-linecap="round"/>
        <path class="trace" d="M0 186 C90 185 140 188 230 186 C320 184 370 187 460 185 C550 183 600 186 690 184 C780 182 830 185 920 183 C960 182 980 184 1000 183"
              fill="none" stroke="#c98500" stroke-width="2" stroke-linecap="round"/>
      </svg>

      <div class="rise d4" style="display: flex; gap: 22px; align-items: center;">
        <div style="display: flex; align-items: center; gap: 7px;">
          <div style="width: 13px; height: 2.5px; border-radius: 2px; background: #ff8a5c;"></div>
          <span style="color: rgba(255,255,255,.72); font-size: 11.5px;">CPU</span>
          <span class="num" style="color: rgba(255,255,255,.42); font-size: 11.5px;">78.5°</span>
        </div>
        <div style="display: flex; align-items: center; gap: 7px;">
          <div style="width: 13px; height: 2.5px; border-radius: 2px; background: #3987e5;"></div>
          <span style="color: rgba(255,255,255,.72); font-size: 11.5px;">Ядро CPU</span>
          <span class="num" style="color: rgba(255,255,255,.42); font-size: 11.5px;">69.1°</span>
        </div>
        <div style="display: flex; align-items: center; gap: 7px;">
          <div style="width: 13px; height: 2.5px; border-radius: 2px; background: #199e70;"></div>
          <span style="color: rgba(255,255,255,.72); font-size: 11.5px;">Корпус</span>
          <span class="num" style="color: rgba(255,255,255,.42); font-size: 11.5px;">37.0°</span>
        </div>
        <div style="display: flex; align-items: center; gap: 7px;">
          <div style="width: 13px; height: 2.5px; border-radius: 2px; background: #c98500;"></div>
          <span style="color: rgba(255,255,255,.72); font-size: 11.5px;">GPU</span>
          <span class="num" style="color: rgba(255,255,255,.42); font-size: 11.5px;">34.3°</span>
        </div>
        <div style="flex-grow: 1;"></div>
        <span style="color: rgba(255,255,255,.28); font-size: 11px;">°C · последние 15 минут</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
