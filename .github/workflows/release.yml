name: Release

# Push a tag like v0.2.0, or run this by hand with a version, and a release with
# a disk image and a zip of GlassFan.app is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 0.2.0 (tag v<version> is created)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Signing and notarisation happen only when these secrets are set.
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Work out the version
        env:
          RAW: ${{ inputs.version || github.ref_name }}
        run: |
          echo "VERSION=${RAW#v}" >> "$GITHUB_ENV"
          echo "GLASSFAN_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Test
        run: swift test

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "GLASSFAN_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Package
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./Scripts/package-release.sh "$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTARISED=false
          if [[ "$HAS_SIGNING" == "true" && "$HAS_NOTARY" == "true" ]]; then NOTARISED=true; fi
          ./Scripts/release-notes.sh "$VERSION" "$NOTARISED" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" dist/* \
            --title "GlassFan $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --target "$GITHUB_SHA"
